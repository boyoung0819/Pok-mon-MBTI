
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff8e8;
      color: #493b2c;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      text-align: center;
    }

    .container {
      width: min(1000px, 92%);
      margin: auto;
      padding: 38px 0 55px;
    }

    .top-icon { font-size: 48px; }

    h1 {
      font-size: clamp(30px, 5vw, 46px);
      color: #664b26;
      margin: 8px 0;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.8;
      color: #806c53;
      margin: 15px 0 30px;
    }

    .panel, .result-card {
      background: #fff;
      border: 2px solid #f5df9f;
      border-radius: 26px;
      padding: 26px;
      box-shadow: 0 7px 0 #f3e5c7;
    }

    h2 { font-size: 24px; margin: 0 0 12px; }

    .help {
      color: #8b7963;
      font-size: 16px;
      margin-bottom: 22px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 11px;
    }

    .mbti-button {
      border: 2px solid #f0dcae;
      border-radius: 14px;
      background: #fffaf0;
      color: #6c5434;
      padding: 16px 4px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: .15s;
    }

    .mbti-button:hover {
      background: #ffe7a1;
      transform: translateY(-2px);
    }

    .mbti-button.selected {
      background: #ffda72;
      border-color: #e8b83e;
    }

    button:focus-visible {
      outline: 3px solid #b88632;
      outline-offset: 3px;
    }

    #result {
      display: none;
      margin-top: 28px;
    }

    .result-card { background: #fffdf7; }

    .result-label {
      display: inline-block;
      background: #ffedb8;
      color: #76551e;
      border-radius: 30px;
      padding: 9px 17px;
      font-weight: bold;
      font-size: 15px;
    }

    .section-title {
      margin: 28px 0 8px;
      font-size: 25px;
    }

    .section-description {
      color: #8b7963;
      line-height: 1.7;
      margin: 0 0 20px;
    }

    .pokemon-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      margin: 20px 0 28px;
    }

    .pokemon-card {
      background: #fff8e8;
      border: 2px solid #f3e2b9;
      border-radius: 20px;
      padding: 16px 10px;
      min-width: 0;
    }

    .pokemon-card:first-child {
      background: #fff0bf;
      border-color: #eac85e;
    }

    .pokemon-tag {
      display: inline-block;
      background: #fff;
      border-radius: 30px;
      padding: 6px 11px;
      font-size: 13px;
      color: #8a682e;
      font-weight: bold;
    }

    .pokemon-name {
      font-size: clamp(18px, 2.7vw, 25px);
      margin: 13px 0 5px;
      color: #5b4426;
      word-break: keep-all;
    }

    .pokemon-art {
      display: block;
      width: min(100%, 180px);
      aspect-ratio: 1;
      object-fit: contain;
      margin: 0 auto;
      filter: drop-shadow(0 5px 4px #d9cba8);
    }

    .emoji-fallback {
      display: none;
      height: 150px;
      align-content: center;
      font-size: 80px;
    }

    .pokemon-reason {
      font-size: 15px;
      line-height: 1.8;
      color: #766348;
      margin: 8px 0 3px;
      word-break: keep-all;
    }

    .compatibility {
      background: #fff1c9;
      border: 2px solid #f0dca2;
      border-radius: 23px;
      padding: 23px;
      margin-top: 28px;
    }

    .compatibility-type {
      font-size: 27px;
      font-weight: bold;
      color: #634619;
      margin: 10px 0 3px;
    }

    .compatibility-reason {
      color: #796344;
      line-height: 1.8;
      font-size: 16px;
      margin: 8px auto 20px;
      max-width: 580px;
      word-break: keep-all;
    }

    .compat-pokemon {
      max-width: 280px;
      margin: auto;
      background: #fffaf0;
      border: 2px solid #f3dfab;
      border-radius: 20px;
      padding: 12px 18px;
    }

    .compat-pokemon .pokemon-art { width: 160px; }

    .action-button {
      margin-top: 26px;
      border: 0;
      border-radius: 15px;
      background: #eab94d;
      color: #49330f;
      font-size: 18px;
      font-weight: bold;
      padding: 16px 30px;
      cursor: pointer;
    }

    .action-button:hover { background: #f4ca69; }

    .note {
      font-size: 13px;
      line-height: 1.8;
      color: #a18c70;
      margin-top: 25px;
    }

    @media (max-width: 600px) {
      .container { padding-top: 25px; }
      .panel, .result-card { padding: 20px 12px; }
      .mbti-grid { gap: 7px; }
      .mbti-button { font-size: 15px; padding: 14px 1px; }
      .pokemon-grid { gap: 7px; }
      .pokemon-card { padding: 12px 5px; border-radius: 15px; }
      .pokemon-tag { font-size: 11px; padding: 5px 7px; }
      .pokemon-reason { font-size: 13px; line-height: 1.65; }
      .pokemon-art { width: 100%; }
    }
  </style>
</head>

<body>

    <div class="top-icon">⚡</div>
    <h1>MBTI로 포켓몬 찾기</h1>

    <p class="subtitle">
      나와 닮은 포켓몬은 누구일까?<br>
      MBTI를 선택하고 나만의 포켓몬 친구들을 만나 봐!
    </p>

    <section class="panel" id="selection">
      <h2>✨ 나의 MBTI는?</h2>
      <p class="help">16가지 유형 중 하나를 선택해 줘!</p>
      <div class="mbti-grid" id="mbtiGrid"></div>
    </section>

    <section id="result" aria-live="polite">
      <div class="result-card">
        <span class="result-label" id="resultType"></span>

        <h2 class="section-title">💛 나와 닮은 포켓몬</h2>
        <p class="section-description">
          나의 성격과 어울리는 포켓몬 3마리를 찾아봤어!
        </p>

        <div class="pokemon-grid" id="pokemonGrid"></div>

        <div class="compatibility">
          <h2>🤝 나와 잘 맞는 MBTI</h2>
          <div class="compatibility-type" id="compatType"></div>
          <p class="compatibility-reason" id="compatReason"></p>

          <div class="compat-pokemon">
            <span class="pokemon-tag">궁합 포켓몬</span>
            <h3 class="pokemon-name" id="compatPokemonName"></h3>
            <img class="pokemon-art" id="compatPokemonImage" src="" alt="">
            <div class="emoji-fallback" id="compatFallback">✨</div>
          </div>
        </div>

        <button class="action-button" id="resetButton">
          ↩ 다시 고르기
        </button>
      </div>
    </section>

    <p class="note">
      포켓몬과 MBTI의 연결은 재미를 위한 창작 결과예요.<br>
      실제 성격이나 인간관계의 궁합을 과학적으로 판단하는 검사는 아니에요.
    </p>
  </main>

        matchReason: "깊이 있는 분석과 추진력이 만나 큰 목표를 구체적인 계획으로 바꿀 수 있어요.",
        pokemon: [
          { name: "갸라도스", id: 130, emoji: "🌊", reason: "강한 추진력과 존재감으로 목표를 향해 나아가요." },
          { name: "마기라스", id: 248, emoji: "⛰️", reason: "압도적인 힘과 자신감으로 어려운 상황에 맞서요." },
          { name: "엘레이드", id: 475, emoji: "⚔️", reason: "결단력과 전략적인 행동으로 문제를 해결하는 모습이 어울려요." }
        ]
      }
    };

    const mbtiTypes = [
      "ISTJ", "ISFJ", "INFJ", "INTJ",
      "ISTP", "ISFP", "INFP", "INTP",
      "ESTP", "ESFP", "ENFP", "ENTP",
      "ESTJ", "ESFJ", "ENFJ", "ENTJ"
    ];

    const grid = document.getElementById("mbtiGrid");
    const result = document.getElementById("result");
    const selection = document.getElementById("selection");

    // 공식 일러스트 이미지 주소
    function imageUrl(id) {
      return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"
        + id + ".png";
    }

    // 버튼 만들기
    mbtiTypes.forEach(function(type) {
      const button = document.createElement("button");
      button.className = "mbti-button";
      button.textContent = type;
      button.type = "button";
      button.setAttribute("aria-pressed", "false");

      button.addEventListener("click", function() {
        showPokemon(type);
      });

      grid.appendChild(button);
    });

    // 포켓몬 카드 생성
    function createPokemonCard(pokemon, index) {
      const card = document.createElement("article");
      card.className = "pokemon-card";

      const tag = document.createElement("span");
      tag.className = "pokemon-tag";
      tag.textContent = index === 0 ? "대표 포켓몬" : "추천 포켓몬";

      const name = document.createElement("h3");
      name.className = "pokemon-name";
      name.textContent = pokemon.name;

      const img = document.createElement("img");
      img.className = "pokemon-art";
      img.src = imageUrl(pokemon.id);
      img.alt = pokemon.name + " 이미지";
      img.loading = "lazy";

      const fallback = document.createElement("div");
      fallback.className = "emoji-fallback";
      fallback.textContent = pokemon.emoji;
      fallback.setAttribute("aria-label", pokemon.name);

      img.onerror = function() {
        img.style.display = "none";
        fallback.style.display = "grid";
      };

      const reason = document.createElement("p");
      reason.className = "pokemon-reason";
      reason.textContent = pokemon.reason;

      card.append(tag, name, img, fallback, reason);
      return card;
    }

    function showPokemon(type) {
      const data = pokemonData[type];

      document.querySelectorAll(".mbti-button").forEach(function(button) {
        const active = button.textContent === type;
        button.classList.toggle("selected", active);
        button.setAttribute("aria-pressed", String(active));
      });

      document.getElementById("resultType").textContent =
        "나의 MBTI: " + type;

      const pokemonGrid = document.getElementById("pokemonGrid");
      pokemonGrid.replaceChildren();

      // 선택한 유형의 포켓몬 3마리
      data.pokemon.forEach(function(pokemon, index) {
        pokemonGrid.appendChild(createPokemonCard(pokemon, index));
      });

      // 궁합 유형의 포켓몬도 함께 표시
      const matchData = pokemonData[data.match];
      const mainIds = new Set(data.pokemon.map(function(p) {
        return p.id;
      }));

      // 혹시 중복이 생기더라도 다른 포켓몬을 선택
      const compatPokemon = matchData.pokemon.find(function(pokemon) {
        return !mainIds.has(pokemon.id);
      });

      document.getElementById("compatType").textContent = data.match;
      document.getElementById("compatReason").textContent =
        data.matchReason;

      const compatName = document.getElementById("compatPokemonName");
      const compatImage = document.getElementById("compatPokemonImage");
      const compatFallback = document.getElementById("compatFallback");

      compatName.textContent = compatPokemon.name;
      compatImage.style.display = "block";
      compatFallback.style.display = "none";
      compatFallback.textContent = compatPokemon.emoji;
      compatImage.alt = compatPokemon.name + " 이미지";
      compatImage.onerror = function() {
        compatImage.style.display = "none";
        compatFallback.style.display = "grid";
      };
      compatImage.src = imageUrl(compatPokemon.id);

      result.style.display = "block";
      result.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // 다시 고르기
    document.getElementById("resetButton").addEventListener("click", function() {
      result.style.display = "none";

      document.querySelectorAll(".mbti-button").forEach(function(button) {
        button.classList.remove("selected");
        button.setAttribute("aria-pressed", "false");
      });

      selection.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  </script>
</body>
</html>
